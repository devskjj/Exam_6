<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/edit.css">
    <title>Edit</title>
</head>
<body>

<div class="container">
    <h1>Редактировать пациента</h1>

    <#if error??>
    <div style="color:red;">${error}</div>
</#if>

<form action="/day" method="post">
    <input type="hidden" name="index" value="${editIndex}">

    <div>
        <label>Время приема:</label>
        <input type="number" name="time" value="${editClient.time}" min="8" max="17" required>
    </div>

    <div>
        <label>Дата приема:</label>
        <input type="date" name="date" value="date" required>
    </div>

    <div>
        <label>Тип пациента:</label>
        <input type="text" name="clientType" value="${editClient.clientType}" required>
    </div>

    <div>
        <label>Симптомы:</label>
        <input type="text" name="symptoms" value="${editClient.symptoms}">
    </div>

    <div style="margin-top: 15px;">
        <button type="submit">Сохранить изменения</button>
    </div>
</form>
</div>


</body>
</html>
