<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Календарь записи пациентов</title>
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>

<div class="container">
    <h1>Календарь записи пациентов -
        Декабрь 2025</h1>

    <table>
        <thead>
        <tr>
            <th>Пн</th>
            <th>Вт</th>
            <th>Ср</th>
            <th>Чт</th>
            <th>Пт</th>
            <th>Сб</th>
            <th>Вс</th>
        </tr>
        </thead>

        <tbody>
        <tr>

            <#list days as day>
                <td class="${(day == today)?then('today', '')}">
                    <a href="/day?year=${day.year?c}&month=${day.monthValue}&date=${day.dayOfMonth}">${day.dayOfMonth}</a>
                </td>

                <#if day.dayOfWeek.value == 7>
                    </tr><tr>
                </#if>
            </#list>

        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
