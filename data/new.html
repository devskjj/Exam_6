<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/new.css">
    <title>New</title>
</head>
<body>

<div class="container">
    <h1>Добавить пациента</h1>

    <#if error??>
    <div class="error-message" style="color: red; margin-bottom: 10px;">
        ${error}
    </div>
    </#if>

    <form action="/new" method="post">
        <div>
            <label for="time">Время сеанса:</label>
            <input type="number" id="time" name="time" min="0" max="23" required>
        </div>

        <div>
            <label for="time">День сеанса:</label>
            <input type="date" id="date" name="date" min="0" max="23" required>
        </div>

        <div>
            <label for="firstName">Имя:</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>

        <div>
            <label for="lastName">Фамилия:</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>

        <div>
            <label for="surName">Отчество:</label>
            <input type="text" id="surName" name="surName">
        </div>

        <div>
            <label for="birthDate">Дата рождения:</label>
            <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <div>
            <label for="clientType">Тип пациента:</label>
            <input type="text" id="clientType" name="clientType" required>
        </div>

        <div>
            <label for="symptoms">Симптомы:</label>
            <input type="text" id="symptoms" name="symptoms">
        </div>

        <div style="margin-top: 15px;">
            <button type="submit">Добавить пациента</button>
        </div>
    </form>
</div>

</body>
</html>
